<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý HWID</title>
    <style>
        body { font-family: Arial, sans-serif; background: #23272a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2f3136; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #4f545c; background: #40444b; color: white; box-sizing: border-box; }
        button { width: 100%; background: #43b581; color: white; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #3ca374; }
        .logout { margin-top: 15px; text-align: center; }
        .logout a { color: #f04747; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Bảng Quản Lý HWID</h2>
        <p>Tài khoản: <b><%= username %></b></p>
        <p>HWID Hiện Tại: <br><code style="color: #faa61a;"><%= currentHwid %></code></p>
        <hr style="border-color: #4f545c; margin: 20px 0;">
        
        <form action="/save-hwid" method="POST">
            <label>Nhập mã HWID mới:</label>
            <input type="text" name="hwid" placeholder="Nhập HWID của bạn..." required>
            <button type="submit">Cập nhật HWID vào Whitelist</button>
        </form>

        <div class="logout">
            <a href="/logout">Đăng xuất</a>
        </div>
    </div>
</body>
</html>
